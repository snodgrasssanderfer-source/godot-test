services:
  napcat:
    # Official v4.18.41 multi-arch digest, resolved 2026-10-29; no floating latest.
    image: mlikiowa/napcat-docker@sha256:b101b8968cc31ae428ec0f8e117386e4ced7773b2d8226ed9f7ddfcec55f1b7e
    user: "${NAPCAT_UID:-1000}:${NAPCAT_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    shm_size: 256m
    entrypoint: ["/bin/bash", "/xiaoke/minimal-entrypoint.sh"]
    environment:
      HOME: /app
      DISPLAY: ":1"
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./minimal-entrypoint.sh:/xiaoke/minimal-entrypoint.sh:ro
      - ./data/NapCat.Shell.zip:/app/NapCat.Shell.zip:ro
      # Runtime files use an ordinary private directory; do not relax tmpfs/noexec policy.
      - ./data/runtime:/app/napcat
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
    tmpfs:
      - /tmp:size=192m,mode=1777
      - /app/.cache:size=128m,uid=${NAPCAT_UID:-1000},gid=${NAPCAT_GID:-1000}
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
